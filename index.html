const norm=v=>String(v??"").trim().toLowerCase();const app=document.getElementById('app'),toast=document.getElementById('toast');let db=JSON.parse(readLocal()||'{"users":[],"docs":[],"requests":[]}'),session=null,pending=null,reg;function readLocal(){try{return localStorage.getItem('absherProCompany1')}catch{return null}}const save=()=>{try{localStorage.setItem('absherProCompany1',JSON.stringify(db))}catch{throw Error('This browser blocks local storage. Changes cannot be saved.')}};const el=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function saltId(){return Array.from(crypto.getRandomValues(new Uint8Array(16)),x=>x.toString(16).padStart(2,'0')).join('')}async function hash(s){let bytes=new TextEncoder().encode(s);if(globalThis.crypto?.subtle)return Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',bytes)),x=>x.toString(16).padStart(2,'0')).join('');let H=[],K=[];for(let n=2;K.length<64;n++){if(Array.from({length:Math.floor(Math.sqrt(n))-1},(_,i)=>i+2).some(i=>n%i===0))continue;if(H.length<8)H.push((Math.sqrt(n)*4294967296)|0);K.push((Math.cbrt(n)*4294967296)|0)}let l=bytes.length,buf=new Uint8Array(Math.ceil((l+9)/64)*64);buf.set(bytes);buf[l]=128;let dv=new DataView(buf.buffer);dv.setUint32(buf.length-4,l*8);let R=(x,n)=>(x>>>n)|(x<<(32-n));for(let off=0;off<buf.length;off+=64){let w=new Int32Array(64);for(let i=0;i<16;i++)w[i]=dv.getInt32(off+i*4);for(let i=16;i<64;i++){let x=w[i-15],y=w[i-2];w[i]=w[i-16]+(R(x,7)^R(x,18)^(x>>>3))+w[i-7]+(R(y,17)^R(y,19)^(y>>>10))}let [a,b,c,d,e,f,g,h]=H;for(let i=0;i<64;i++){let t=(h+(R(e,6)^R(e,11)^R(e,25))+((e&f)^(~e&g))+K[i]+w[i])|0,u=((R(a,2)^R(a,13)^R(a,22))+((a&b)^(a&c)^(b&c)))|0;[a,b,c,d,e,f,g,h]=[(t+u)|0,a,b,c,(d+t)|0,e,f,g]}H=H.map((v,i)=>(v+[a,b,c,d,e,f,g,h][i])|0)}return H.map(x=>(x>>>0).toString(16).padStart(8,'0')).join('')}function page(s){app.innerHTML='<section>'+s+'</section>'}function notice(s){toast. h3>'+db.requests.map((r,i)=>'<p>'+esc(r.user)+' — '+esc(r.service)+' — '+esc(r.status)+'<button onclick=decision('+i+',true)>Approve</button><button class=secondary onclick=decision('+i+',false)>Reject</button></p>').join('')+'<button class=secondary onclick=home()>Sign out</button>');el('f').onsubmit=async e=>{e.preventDefault();let name=el('u').value.trim(),salt=saltId(),h=await hash(salt+el('p').value);if(!name||name.toUpperCase()==='AD')return notice('Choose a different employee username');let old=db.users.find(u=>norm(u.name)===norm(name));if(old){Object.assign(old,{salt,hash:h})}else{db.users.push({name,salt,hash:h})}save();admin();notice("Employee account saved successfully")};el('d').onsubmit=async e=>{e.preventDefault();let btn=e.currentTarget.querySelector('button');btn.disabled=true;try{let owner=el('owner').value,title=el('t').value;if(!owner)throw Error('Select an employee first');let content=await prepareImage(el('file').files[0]);db.docs.push({user:owner,title,content});try{save()}catch(err){db.docs.pop();throw Error('Device storage is full or unavailable. Remove unused images and retry.')}admin();notice('Image uploaded successfully')}catch(err){notice(err.message)}finally{btn.disabled=false}}}
async function prepareImage(file,maxSide=2200){if(!file||!['image/png','image/jpeg','image/webp'].includes(file.type)||file.size>25*1024*1024)throw Error('Choose a JPG, PNG or WebP image up to 25 MB');let url=URL.createObjectURL(file);try{let img=new Image();img.src=url;await img.decode();let scale=Math.min(1,maxSide/Math.max(img.width,img.height));let canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));let ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);let result=canvas.toDataURL('image/jpeg',.88);for(let q=.8;result.length>900000&&q>=.4;q-=.1)result=canvas.toDataURL('image/jpeg',q);if(result.length>900000)throw Error('Image is too complex; choose a smaller image');return result}finally{URL.revokeObjectURL(url)}}
function removeUser(i){if(!session?.admin)return;let n=db.users[i].name;db.users.splice(i,1);db.docs=db.docs.filter(d=>d.user!==n);db.requests=db.requests.filter(r=>r.user!==n);save();admin()}function removeDoc(i){if(session?.admin){db.docs.splice(i,1);save();admin()}}function decision(i,yes){if(session?.admin){db.requests[i].status=yes?'Approved':'Rejected';save();admin()}}function downloadDoc(i){let d=db.docs[i];if(!session||!d||(!session.admin&&d.user!==session.name))return;let a=document.createElement('a');a.href=d.content;a.download=d.title;a.click()}
function csvRows(t){let rows=[],r=[],v='',q=false;for(let i=0;i<t.length;i++){let c=t[i];if(c==='"'){if(q&&t[i+1]==='"'){v+='"';i++}else q=!q}else if(c===','&&!q){r.push(v);v=''}else if(c==='\n'&&!q){r.push(v.replace(/\r$/,''));rows.push(r);r=[];v=''}else v+=c}if(q)throw Error('Unclosed quote');if(v||r.length){r.push(v.replace(/\r$/,''));rows.push(r)}return rows}
const fields=['username','employee_id','full_name','arabic_name','department','job_title','issue_date','expiry_date'];
function importScreen(){if(!session?.admin)return;page('<h2>Import employee records</h2><p>Save your Excel sheet as CSV UTF-8. Existing usernames are updated; new users require a password assigned separately.</p><button onclick=template()>Download CSV template</button><input id=csv type=file accept=".csv"><button id=imp>Import</button><button class=secondary onclick=admin()>Back</button>');el('imp').onclick=async()=>{try{let rows=csvRows((await el('csv').files[0].text()).replace(/^\uFEFF/,'')),head=rows.shift().map(x=>x.trim().toLowerCase());if(!fields.every(f=>head.includes(f)))throw Error('Missing required columns');let records=rows.filter(r=>r.some(Boolean)).map(r=>Object.fromEntries(fields.map(f=>[f,(r[head.indexOf(f)]||'').trim()])));if(records.some(r=>!r.username||r.username.toUpperCase()==='AD'||!r.employee_id||!r.full_name)||new Set(records.map(r=>r.username)).size!==records.length)throw Error('Missing values or duplicate usernames');for(let r of records){let u=db.users.find(u=>u.name===r.username);if(!u){u={name:r.username};db.users.push(u)}u.profile={...u.profile,...r}}save();notice(records.length+' records imported');admin()}catch(e){notice(e.message)}}}
function template(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([fields.join(',')+'\n'],{type:'text/csv'}));a.download='employee-template.csv';a.click();URL.revokeObjectURL(a.href)}
function profileScreen(){if(!session?.admin)return;page('<h2>Employee profile</h2><select id=who>'+db.users.map((u,i)=>'<option value='+i+'>'+esc(u.name)+'</option>').join('')+'</select><div id=pf></div><button class=secondary onclick=admin()>Back</button>');function load(){let u=db.users[Number(el('who').value)];if(!u)return;el('pf').innerHTML='<form id=pfForm>'+fields.slice(1).map(f=>'<label>'+f.replaceAll('_',' ')+'<input id="'+f+'" value="'+esc(u.profile?.[f]||'')+'"></label>').join('')+'<label>Photo<input id=photo type=file accept="image/png,image/jpeg,image/webp"></label><button>Save profile</button></form>';el('pfForm').onsubmit=async e=>{e.preventDefault();let r={...u.profile};for(let f of fields.slice(1))r[f]=el(f).value;let file=el('photo').files[0];let btn=e.currentTarget.querySelector('button');btn.disabled=true;let old=u.profile;try{if(file)r.photo=await prepareImage(file,1000);u.profile=r;try{save()}catch(err){u.profile=old;throw Error('Device storage is full or unavailable. Remove unused images and retry.')}notice('Profile saved')}catch(err){notice(err.message)}finally{btn.disabled=false}}}el('who').onchange=load;load()}
function employeeCard(){if(!session||session.admin)return;let r=db.users.find(u=>u.name===session.name)?.profile;if(!r){page('<h2>Employee identity</h2><p>No identity issued.</p><button onclick=wallet()>Back</button>');return}let photo=r.photo&&/^data:image\/(png|jpeg);base64,/.test(r.photo)?'<img style="width:82px;height:100px;object-fit:cover;border-radius:8px" src="'+esc(r.photo)+'">':'';page('<h2>Employee identity</h2><div id=card style="background:#edf5f0;border:2px solid #08784e;border-radius:18px;padding:18px"><b>AP EMPLOYEE PORTAL</b><p>PRIVATE COMPANY ID · بطاقة موظف</p><div id=front>'+photo+'<h2>'+esc(r.full_name||'')+'</h2><p dir=rtl>'+esc(r.arabic_name||'')+'</p><p>Employee number: '+esc(r.employee_id||'')+'</p><p>'+esc(r.job_title||'')+' · '+esc(r.department||'')+'</p></div><div id=back hidden><p>Issued: '+esc(r.issue_date||'')+'</p><p>Expires: '+esc(r.expiry_date||'')+'</p><p>'+ (r.expiry_date&&new Date(r.expiry_date)<new Date()?'Expired':'Check validity with company HR')+'</p><p>Not a government identity document.</p></div></div><button id=flip>Flip card</button><button id=full>Full screen</button><button class=secondary onclick=wallet()>Back</button>');el('flip').onclick=()=>{el('front').hidden=!el('front').hidden;el('back').hidden=!el('back').hidden};el('full').onclick=()=>el('card').requestFullscreen?.().catch(()=>notice('Full screen unavailable'))}
home();</script></body></html>
